<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
        }

        h1{
            text-align:center;
            background:#ff5722;
            color:white;
            padding:20px;
        }

        .box{
    width:340px;
    margin:20px auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    text-align:center;
    transition:.3s;
}

.box:hover{
    transform:translateY(-8px);
}

        img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:15px;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }

       .btn{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    display:inline-block;
    font-weight:bold;
}

.remove-btn{
    background:#e53935;
}

.cart-btn{
    background:#ff5722;
}

.back-btn{
    background:#4caf50;
}
    </style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

{% for item in items %}

<div class="box">

{% if item.food.image %}
<img src="{{ item.food.image.url }}">
{% endif %}

<h2 style="color:#222;">
{{ item.food.name }}
</h2>
<div style="
display:inline-block;
background:#28a745;
color:white;
padding:5px 12px;
border-radius:20px;
font-weight:bold;
margin:10px 0;
">

⭐ {{ item.food.rating }}

</div>
<div class="price">
₹{{ item.food.price }}
</div>

<p>{{ item.food.description }}</p>

<a href="/remove-from-wishlist/{{ item.id }}" class="btn remove-btn">
🗑️ Remove
</a>
<br><br>

<a href="/add-to-cart/{{ item.food.id }}" class="btn cart-btn">
🛒 Move to Cart
</a>

<br><br>

<a href="/" class="btn back-btn">
⬅️ Back
</a>

</div>

{% empty %}

<h2 style="text-align:center;">
No items in Wishlist ❤️
</h2>

{% endfor %}

</body>
</html>
