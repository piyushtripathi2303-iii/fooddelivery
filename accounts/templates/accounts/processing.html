<!DOCTYPE html>
<html>
<head>
    <title>Processing Payment</title>

    <style>

    body{
        margin:0;
        font-family:Arial,sans-serif;
        background:#f5f5f5;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .box{
        background:white;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 0 20px rgba(0,0,0,.2);
        width:350px;
    }

    .loader{
        width:70px;
        height:70px;
        border:8px solid #ddd;
        border-top:8px solid #ff5722;
        border-radius:50%;
        margin:20px auto;
        animation:spin 1s linear infinite;
    }

    @keyframes spin{
        100%{
            transform:rotate(360deg);
        }
    }

    h1{
        color:#ff5722;
    }

    p{
        color:gray;
        font-size:18px;
    }

    </style>

    <script>

    setTimeout(function(){
        alert("Processing Finished");
        window.location.href="/tracking/";
    },3000);

    </script>

</head>

<body>

<div class="box">

<h1>💳 Payment Processing...</h1>

<div class="loader"></div>

<p>Please wait...</p>

</div>

</body>
</html>
