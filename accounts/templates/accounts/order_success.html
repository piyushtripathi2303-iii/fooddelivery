<!DOCTYPE html>
<html>
<head>
    <title>Order Success</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:linear-gradient(to right,#ffecd2,#fcb69f);
            font-family:Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:500px;
            background:white;
            padding:40px;
            text-align:center;
            border-radius:20px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        .tick{
            font-size:80px;
        }

        h1{
            color:green;
            margin-top:10px;
        }

        p{
            color:#555;
            font-size:18px;
        }

        .btn{
            display:inline-block;
            margin:15px;
            padding:12px 25px;
            text-decoration:none;
            color:white;
            border-radius:8px;
            font-size:18px;
        }

        .orders{
            background:#28a745;
        }

        .home{
            background:#007bff;
        }

        .btn:hover{
            opacity:0.9;
        }
    </style>
</head>

<body>

<div class="box">

<div class="tick">🎉✅</div>

<h1>Order Placed Successfully!</h1>

<p>Thank You for Ordering with Food Delivery App.</p>

<p>Your delicious food is being prepared 🍕🍔🍟</p>

<a href="/orders/" class="btn orders">📦 View My Orders</a>

<a href="/" class="btn home">🏠 Back to Home</a>

</div>

</body>
</html>
