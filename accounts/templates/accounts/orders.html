<!DOCTYPE html>
<html>
<head>
<title>My Orders</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    color:#ff5722;
}

.box{
    width:600px;
    margin:20px auto;
}

.order-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
    margin-bottom:20px;
}

.price{
    color:green;
    font-size:22px;
    font-weight:bold;
}

.date{
    color:gray;
}

.status{
    display:inline-block;
    background:#28a745;
    color:white;
    padding:6px 14px;
    border-radius:20px;
    margin-top:10px;
}

.home{
    display:block;
    width:220px;
    margin:30px auto;
    text-align:center;
    background:#ff5722;
    color:white;
    padding:12px;
    text-decoration:none;
    border-radius:10px;
}
</style>

</head>

<body>

<h1>📦 My Orders</h1>

<div class="box">

{% if orders %}

{% for order in orders %}

<div class="order-card">

<h2>🍽️ {{ order.food.name }}</h2>

<p class="price">₹{{ order.food.price }}</p>

<p class="date">📅 {{ order.order_date }}</p>

<p>🚚 Delivery Time : 25-30 Minutes</p>

<span class="status">✅ Delivered</span>

</div>

{% endfor %}

{% else %}

<h2 style="text-align:center;">No Orders Yet 😔</h2>

{% endif %}

<a href="/" class="home">🏠 Back to Home</a>

</div>

</body>
</html>
