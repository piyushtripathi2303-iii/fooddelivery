<!DOCTYPE html>
<html>
<head>
<title>Food Delivery Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5722,#ff9800);
}

.login-box{
width:400px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:35px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,.3);
text-align:center;
color:white;
}

.logo{
font-size:70px;
margin-bottom:10px;
}

h2{
font-size:32px;
margin-bottom:8px;
}

p{
margin-bottom:20px;
color:#f8f8f8;
}

.input-box{
margin:15px 0;
}

.input-box input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:white;
color:#ff5722;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#222;
color:white;
transform:scale(1.03);
}

.register{
margin-top:20px;
}

.register a{
color:white;
font-weight:bold;
text-decoration:none;
}

.register a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">🍕</div>

<h2>Food Delivery</h2>

<p>Fresh Food • Fast Delivery</p>

<form method="POST">

{% csrf_token %}

<div class="input-box">
<input type="text" name="name" placeholder="👤 Username" required>
</div>

<div class="input-box">
<input type="password" name="password" placeholder="🔒 Password" required>
</div>

<button type="submit">
🚀 Login
</button>

</form>

<div class="register">

<p>Don't have an account?</p>

<a href="/register/">
✨ Create New Account
</a>

</div>

</div>

</body>
</html>
