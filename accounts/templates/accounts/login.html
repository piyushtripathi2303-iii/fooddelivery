<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery Login</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:#f4f4f4;
            font-family:Arial, sans-serif;
        }

        .login-box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        h2{
            color:green;
            margin-bottom:20px;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            border:1px solid gray;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:95%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        a{
            text-decoration:none;
            color:green;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Food Delivery Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Enter Username" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <br>

    <p>Don't have an account?</p>

    <a href="/register/">Create New Account</a>

</div>


</body>
</html>
