<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>

    <style>

    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
    }

    .box{
        width:420px;
        margin:50px auto;
        background:white;
        padding:25px;
        border-radius:15px;
        box-shadow:0 0 15px gray;
    }

    h1{
        text-align:center;
        color:#ff5722;
    }

    h3{
        margin-top:20px;
    }

    label{
        display:flex;
        align-items:center;
        gap:10px;
        font-size:18px;
        margin:12px 0;
        cursor:pointer;
    }

    input[type="radio"]{
        width:20px;
        height:20px;
        margin:0;
    }

    input[type="text"],
    input[type="password"]{
        width:100%;
        padding:12px;
        margin-top:12px;
        border:2px solid #ddd;
        border-radius:8px;
        font-size:16px;
        box-sizing:border-box;
    }

    button{
        width:100%;
        padding:14px;
        margin-top:20px;
        background:#28a745;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        background:green;
    }

    </style>

</head>

<body>

<div class="box">

<h1>💳 Payment</h1>

<form method="POST" action="/place-order/">

{% csrf_token %}

<h3>Select Payment Method</h3>

<label>
<input type="radio" name="payment_method" value="card" checked>
💳 Credit / Debit Card
</label>

<label>
<input type="radio" name="payment_method" value="upi">
📱 UPI Payment
</label>

<label>
<input type="radio" name="payment_method" value="cod">
💵 Cash on Delivery
</label>

<hr>

<div id="card-box">

<input type="text" placeholder="Card Holder Name">

<input type="text" placeholder="Card Number">

<input type="text" placeholder="MM/YY">

<input type="password" placeholder="CVV">

</div>

<div id="upi-box" style="display:none;">

<input type="text" placeholder="Enter UPI ID">

</div>

<button type="submit">
🔒 Confirm Payment
</button>

</form>

</div>

<script>

const radios = document.getElementsByName("payment_method");

const card = document.getElementById("card-box");

const upi = document.getElementById("upi-box");

for(let r of radios){

r.onclick=function(){

if(this.value=="card"){
card.style.display="block";
upi.style.display="none";
}

else if(this.value=="upi"){
card.style.display="none";
upi.style.display="block";
}

else{
card.style.display="none";
upi.style.display="none";
}

}

}

</script>

</body>
</html>
