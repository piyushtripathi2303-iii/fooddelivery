<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>

    <style>

    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
    }

    .box{
        width:500px;
        margin:40px auto;
        background:white;
        padding:30px;
        border-radius:20px;
        box-shadow:0 10px 25px rgb(0,0,0,.15);
    }

    h1{
        text-align:center;
        color:#ff5722;
        font-size:36px;
        margin-bottom:25px;
    }

    h3{
        margin-top:20px;
    }

     label{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:18px;
    margin:12px 0;
    cursor:pointer;
    padding:15px;
    border:2px solid #eee;
    border-radius:12px;
    transition:.3s;
}

label:hover{
    border-color:#ff5722;
    background:#fff3e0;
}

    input[type="radio"]{
        width:20px;
        height:20px;
        margin:0;
    }

    input[type="text"],
    input[type="password"]{
        width:100%;
        padding:14px;
        border:2px solid #ddd;
        border-radius:10px;
        font-size:16px;
    }
    input:focus{
        border-color: #ff5722;
        outline: none;
    }

    button{
        width:100%;
        padding:16px;
        background:#ff5722;
        color:white;
        border:none;
        border-radius:12px;
        font-size:20px;
        font-weight: bold;
        cursor:pointer;
    }

    button:hover{
        background:#e64a19;
    }

    </style>

</head>

<body>

<div class="box">

<h1>💳 Payment</h1>
<div style="
background:#fff3e0;
padding:15px;
border-radius:12px;
margin-bottom:20px;
">

<h3>🧾 Order Summary</h3>

<p>Total Amount :
<b style="color:#28a745;">
₹{{ grand_total }}
</b>
</p>

<p>🚚 Free Delivery</p>

</div>
<form method="POST" action="/place-order/">

{% csrf_token %}

<h3>Select Payment Method</h3>

<label>
<input type="radio" name="payment_method" value="card" checked>
💳 Credit / Debit Card
</label>

<label>
<input type="radio" name="payment_method" value="upi">
📱 UPI Payment
</label>

<label>
<input type="radio" name="payment_method" value="cod">
💵 Cash on Delivery
</label>

<hr>

<div id="card-box">

<input type="text" placeholder="Card Holder Name">

<input type="text" placeholder="Card Number">

<input type="text" placeholder="MM/YY">

<input type="password" placeholder="CVV">

</div>

<div id="upi-box" style="display:none;">

<input type="text" placeholder="Enter UPI ID">

</div>
<p style="
text-align:center;
color:green;
font-weight:bold;
margin-top:20px;
">
🔒 100% Secure Payment
</p>
<button type="submit">
🔒 Confirm Payment
</button>

</form>

</div>

<script>

const radios = document.getElementsByName("payment_method");

const card = document.getElementById("card-box");

const upi = document.getElementById("upi-box");

for(let r of radios){

r.onclick=function(){

if(this.value=="card"){
card.style.display="block";
upi.style.display="none";
}

else if(this.value=="upi"){
card.style.display="none";
upi.style.display="block";
}

else{
card.style.display="none";
upi.style.display="none";
}

}

}

</script>

</body>
</html>
