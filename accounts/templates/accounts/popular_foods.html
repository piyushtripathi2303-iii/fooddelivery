<!DOCTYPE html>
<html>
<head>
    <title>Popular Foods</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        background:#f5f5f5;
    }

    .header{
        background:#ff5722;
        color:white;
        text-align:center;
        padding:25px;
        font-size:35px;
        font-weight:bold;
    }

    .back{
        text-align:center;
        margin:20px;
    }

    .back a{
        text-decoration:none;
        background:#ff5722;
        color:white;
        padding:12px 25px;
        border-radius:30px;
        font-weight:bold;
    }

    .back a:hover{
        background:#e64a19;
    }

    .container{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:25px;
        padding:30px;
    }

    .food-box{
        width:300px;
        background:white;
        border-radius:18px;
        overflow:hidden;
        box-shadow:0 8px 20px rgba(0,0,0,.15);
        transition:.3s;
    }

    .food-box:hover{
        transform:translateY(-10px);
    }

    .food-box img{
        width:100%;
        height:220px;
        object-fit:cover;
    }

    .details{
        padding:18px;
        text-align:center;
    }

    .details h2{
        color:#333;
    }

    .price{
        color:green;
        font-size:24px;
        font-weight:bold;
        margin:10px 0;
    }

    .rating{
        color:#ff9800;
        font-size:18px;
        font-weight:bold;
    }

    button{
        width:100%;
        background:#ff5722;
        color:white;
        border:none;
        padding:14px;
        border-radius:10px;
        margin-top:15px;
        cursor:pointer;
        font-size:16px;
        font-weight:bold;
    }

    button:hover{
        background:#e64a19;
    }

    </style>

</head>

<body>

<div class="header">
🔥 Popular Foods
</div>

<div class="back">
    <a href="/">⬅️ Back To Home</a>
</div>

<div class="container">

{% for food in foods %}

<div class="food-box">

{% if food.image %}
<img src="{{ food.image.url }}">
{% endif %}

<div class="details">

<h2>{{ food.name }}</h2>

<div class="price">
₹{{ food.price }}
</div>

<div class="rating">
⭐ {{ food.rating }}
</div>

<p>{{ food.description }}</p>

<a href="/add-to-cart/{{ food.id }}/">
<button>
🛒 Add To Cart
</button>
</a>

</div>

</div>

{% endfor %}

</div>

</body>
</html>
