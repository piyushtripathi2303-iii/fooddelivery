<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>

    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
    }

    .box{
        width:550px;
        max-width:95%;
        margin:40px auto;
        background:white;
        padding:35px;
        border-radius:25px;
        box-shadow:0 10 30px rgba(0,0,0,.15);
    }

    h1{
        text-align:center;
        color:#ff5722;
        font-size:36px ;
        margin-bottom:20px ;
    }

    label{
        font-weight:bold;
    }

    input,textarea{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:2px solid #ddd;
        border-radius:8px;
        font-size:16px;
        box-sizing:border-box;
    }

    button{
        width:100%;
        padding:15px;
        background:#ff5722;
        color:white;
        border:none;
        border-radius:12px;
        font-size:18px;
        cursor:pointer;
        transition:.3s;
    }

    button:hover{
        background:#e64a19;
    }

    .btn{
        display:block;
        text-align:center;
        background:#28a745;
        color:white;
        text-decoration:none;
        padding:15px;
        border-radius:12px;
        margin-top:25px;
        font-size:bold;
    }

    </style>

</head>

<body>

<div class="box">

<h1>👤 My Profile</h1>
<div style="text-align:center; margin-bottom:25px;">

<img
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
style="
width:120px;
height:120px;
border-radius:50%;
border:5px solid #ff5722;
">

</div>

<form method="POST" action="/profile/">

{% csrf_token %}

<label>Name</label>
<input type="text" name="name" value="{{ user.name }}">

<label>Email</label>
<input type="email" name="email" value="{{ user.email }}">

<label>Phone</label>
<input type="text" name="phone" value="{{ user.phone }}">

<label>Address</label>
<textarea name="address" rows="4">{{ user.address }}</textarea>

<button type="submit">
💾 Update Profile
</button>

</form>

<hr>

<div style="
display:flex;
justify-content:space-between;
gap:15px;
margin-top:25px;
">

<div style="
flex:1;
background:#fff3e0;
padding:15px;
border-radius:15px;
text-align:center;
">
<h2>{{ orders }}</h2>
<p>📦 Orders</p>
</div>

<div style="
flex:1;
background:#ffe6ea;
padding:15px;
border-radius:15px;
text-align:center;
">
<h2>{{ wishlist }}</h2>
<p>❤️ Wishlist</p>
</div>

<div style="
flex:1;
background:#e8f5e9;
padding:15px;
border-radius:15px;
text-align:center;
">
<h2>{{ reviews }}</h2>
<p>⭐ Reviews</p>
</div>

</div>
<a href="/" class="btn">🏠 Back To Home</a>

</div>

</body>
</html>
