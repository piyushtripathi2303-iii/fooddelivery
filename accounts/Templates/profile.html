<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>

    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
    }

    .box{
        width:450px;
        margin:40px auto;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 0 15px gray;
    }

    h1{
        text-align:center;
        color:#ff5722;
    }

    label{
        font-weight:bold;
    }

    input,textarea{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:2px solid #ddd;
        border-radius:8px;
        font-size:16px;
        box-sizing:border-box;
    }

    button{
        width:100%;
        padding:12px;
        background:#28a745;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        background:green;
    }

    .btn{
        display:block;
        text-align:center;
        background:#ff5722;
        color:white;
        text-decoration:none;
        padding:12px;
        border-radius:8px;
        margin-top:20px;
    }

    </style>

</head>

<body>

<div class="box">

<h1>👤 My Profile</h1>

<form method="POST" action="/profile/">

{% csrf_token %}

<label>Name</label>
<input type="text" name="name" value="{{ user.name }}">

<label>Email</label>
<input type="email" name="email" value="{{ user.email }}">

<label>Phone</label>
<input type="text" name="phone" value="{{ user.phone }}">

<label>Address</label>
<textarea name="address" rows="4">{{ user.address }}</textarea>

<button type="submit">
💾 Update Profile
</button>

</form>

<hr>

<p>📦 Total Orders : {{ orders }}</p>

<p>❤️ Wishlist : {{ wishlist }}</p>

<p>⭐ Reviews : {{ reviews }}</p>

<a href="/" class="btn">🏠 Back To Home</a>

</div>

</body>
</html>
