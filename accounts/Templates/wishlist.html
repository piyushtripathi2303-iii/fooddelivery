<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
        }

        h1{
            text-align:center;
            background:#ff5722;
            color:white;
            padding:20px;
        }

        .box{
            width:320px;
            margin:20px auto;
            background:white;
            border-radius:12px;
            padding:15px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        img{
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius:10px;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }

        a{
            text-decoration:none;
            background:#ff5722;
            color:white;
            padding:10px 20px;
            border-radius:8px;
        }
    </style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

{% for item in items %}

<div class="box">

{% if item.food.image %}
<img src="{{ item.food.image.url }}">
{% endif %}

<h2>{{ item.food.name }}</h2>

<div class="price">
₹{{ item.food.price }}
</div>

<p>{{ item.food.description }}</p>

<a href="/remove-from-wishlist/{{ item.id }}/"
style="background:red;">
🗑️ Remove
</a>

<br><br>

<a href="/">⬅️ Back</a>

</div>

{% empty %}

<h2 style="text-align:center;">
No items in Wishlist ❤️
</h2>

{% endfor %}

</body>
</html>
