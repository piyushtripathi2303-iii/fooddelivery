<!DOCTYPE html>
<html>
<head>
    <title>Live Order Tracking</title>

    <style>

    body{
        margin:0;
        font-family:Arial,sans-serif;
        background:#f5f5f5;
    }

    .header{
        background:#ff5722;
        color:white;
        text-align:center;
        padding:20px;
        font-size:30px;
        font-weight:bold;
    }

    .container{
        width:90%;
        max-width:700px;
        margin:30px auto;
        background:white;
        border-radius:20px;
        padding:30px;
        box-shadow:0 0 20px rgba(0,0,0,.2);
    }

    .map{
        position:relative;
        height:450px;
        background:#dff5d8;
        border-radius:20px;
        overflow:hidden;
    }

    .road{
        position:absolute;
        left:50%;
        transform:translateX(-50%);
        width:10px;
        height:100%;
        background:#555;
    }

    .restaurant{
        position:absolute;
        top:20px;
        left:50%;
        transform:translateX(-50%);
        font-size:35px;
    }

    .home{
        position:absolute;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        font-size:35px;
    }

    .scooter{
        position:absolute;
        top:90px;
        left:50%;
        transform:translateX(-50%);
        font-size:38px;
    }

    .info{
        margin-top:25px;
        text-align:center;
    }

    .info h2{
        color:#ff5722;
    }

    .info p{
        font-size:18px;
        margin:10px;
    }

    .btn{
        display:inline-block;
        margin-top:20px;
        background:#ff5722;
        color:white;
        padding:12px 25px;
        border-radius:10px;
        text-decoration:none;
        font-weight:bold;
    }

    .btn:hover{
        background:#e64a19;
    }

    </style>

</head>

<body>

<div class="header">
🛵 Live Order Tracking
</div>

<div class="container">

<div class="map">

<div class="road"></div>

<div class="restaurant">
🏪
</div>

<div class="scooter" id="bike">
🛵
</div>

<div class="home">
🏠
</div>

</div>

<div class="info">

<h2>📦 Order On The Way</h2>
<div id="statusBox" style="margin:20px 0;">

<p id="statusText" style="font-size:20px;font-weight:bold;color:#ff5722;">
✅ Order Confirmed
</p>

<progress id="progressBar" value="25" max="100"
style="width:100%;height:20px;">
</progress>

</div>

<p>🚴 Delivery Partner : Rahul Kumar</p>

<p>⏱️ Estimated Time : 18 Minutes</p>

<p>📞 Contact : 9876543210</p>

<a href="/" class="btn">🏠 Back To Home</a>

</div>

</div>
<script>

let bike = document.getElementById("bike");

let position = 90;

function moveBike(){

    if(position < 330){
        position += 2;
        bike.style.top = position + "px";
    }
    else{
        position = 90;
    }

}

setInterval(moveBike, 30);

</script>
<script>
<a href="/order-success/" class="btn">
    ✅ Order Delivered
</a>
</script>
<script>

let progress = 25;

let text = document.getElementById("statusText");

let bar = document.getElementById("progressBar");

let interval = setInterval(function(){

    progress += 25;

    if(progress <= 100){
        bar.value = progress;
    }

    if(progress == 50){
        text.innerHTML = "👨‍🍳 Preparing Food";
    }

    if(progress == 75){
        text.innerHTML = "🛵 Out For Delivery";
    }

    if(progress == 100){
        text.innerHTML = "✅ Your Order Delivered";
        clearInterval(interval);

        setTimeout(function(){
            window.location.href="/order-success/";
        },2000);
    }

},1200);
</script>
</body>
</html>
